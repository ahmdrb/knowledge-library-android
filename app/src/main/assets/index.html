<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Knowledge Library</title>
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color-scheme:light dark;--bg:#f5f6fa;--panel:#fff;--text:#202333;--muted:#687084;--line:#dfe3ec;--accent:#425bd5;--soft:#e9edff}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--panel:#1b202b;--text:#eef1fa;--muted:#aab2c4;--line:#343b4a;--accent:#a6b3ff;--soft:#2b3459}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{padding:22px 16px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}h1{font-size:23px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.wrap{max-width:900px;margin:auto;padding:16px}.row{display:flex;gap:8px;align-items:center}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:16px;margin:10px 0}button{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:white;font-weight:650;font-size:14px;cursor:pointer}button.secondary{background:var(--soft);color:var(--text)}button.danger{background:#a62d42;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.section-title{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}.pkg{display:flex;align-items:center;gap:12px}.pkgmain{min-width:0;flex:1}.pkgtitle{font-weight:750;font-size:16px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:4px}.treeitem{border-bottom:1px solid var(--line);padding:10px 0}.treeitem:last-child{border-bottom:0}.treebtn{display:flex;align-items:flex-start;gap:5px;width:100%;padding:6px 0;text-align:left;background:transparent;color:var(--text);font-weight:550}.nodetitle{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}.nodeactions{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 0 0}.small{font-size:12px;padding:7px 9px}.crumb{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 14px;overflow-wrap:anywhere}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.result{cursor:pointer}.result strong{display:block}.highlight{background:var(--soft);border-radius:3px}.notice{color:var(--muted);font-size:12px;line-height:1.5}.editor-panel{margin:10px 0 16px}.editor-help{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 8px}.outline-editor{display:block;width:100%;min-height:55vh;resize:vertical;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:14px/1.6 monospace;white-space:pre;tab-size:4}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 8px}
</style>
</head>
<body>
<header><h1>Knowledge Library</h1><div class="sub">Your searchable, offline knowledge map</div></header>
<main class="wrap">
  <div class="row"><input id="search" class="search" placeholder="Search packages and concepts…" autocomplete="off" aria-label="Search packages and concepts"></div>
  <div class="toolbar"><button id="importBtn">＋ Import .txt outline</button><button class="secondary" id="homeBtn">Library home</button></div>
  <div id="status" class="notice" role="status">Imported packages stay on this device.</div>
  <section id="searchResults"></section>
  <section id="homeView"><div class="section-title">Your packages</div><div id="packages"></div></section>
  <section id="detailView" class="hidden"></section>
  <footer>Offline by design · Your imported outlines are stored on this device</footer>
</main>
<script>
(() => {
  const STORE = "knowledge-library-packages-v1";
  const $ = id => document.getElementById(id);
  let packages = load();
  let currentPackageId = null;
  let currentNodeId = null;
  let expanded = new Set();
  let nextId = 1;

  function load(){ try { const v=JSON.parse(localStorage.getItem(STORE)||"[]"); return Array.isArray(v)?v:[]; } catch(e){ return []; } }
  function save(){ localStorage.setItem(STORE,JSON.stringify(packages)); }
  function id(){ return "n"+(Date.now().toString(36))+(nextId++).toString(36); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function allNodes(nodes,out=[]){ for(const n of nodes){out.push(n);allNodes(n.children||[],out);} return out; }
  function countNodes(p){return allNodes(p.nodes||[]).length;}
  function parseOutline(raw){
    const lines=raw.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").split("\n");
    const meaningful=lines.filter(x=>x.trim().length>0);
    if(!meaningful.length) throw new Error("The file has no outline lines.");
    const rootLine=meaningful[0].trim().replace(/^\d+\.\s*/,"").trim();
    if(!rootLine) throw new Error("The first line must contain the package title.");
    const root={id:id(),title:rootLine,children:[]};
    const stack=[{indent:-1,node:root}];
    let accepted=0;
    for(let i=1;i<meaningful.length;i++){
      const line=meaningful[i];
      const spaces=(line.match(/^ */)||[""])[0].length;
      if(line.slice(0,spaces).includes("\t")) throw new Error("Use spaces, not tabs, for indentation.");
      let title=line.slice(spaces).trim();
      title=title.replace(/^\d+\.\s*/,"").trim();
      if(!title) continue;
      if(spaces%4!==0) throw new Error("Indentation must use multiples of four spaces. Check line: "+line.trim());
      const level=spaces/4;
      while(stack.length>1 && stack[stack.length-1].indent>=level) stack.pop();
      const parent=stack[stack.length-1];
      if(level>parent.indent+1) throw new Error("A hierarchy level was skipped near: "+title);
      if(level===0) {
        // Root title is the first line; subsequent top-level numbered entries are its children.
        root.children.push({id:id(),title,children:[]});
        stack.length=1; stack.push({indent:0,node:root.children[root.children.length-1]});
      } else {
        const node={id:id(),title,children:[]};
        parent.node.children.push(node);
        stack.push({indent:level,node});
      }
      accepted++;
    }
    if(!accepted) throw new Error("No numbered categories were found under the root title.");
    return {title:rootLine,nodes:root.children};
  }
  function setStatus(s){$("status").textContent=s;}
  function importFile(){ if(window.NativeLibrary&&typeof window.NativeLibrary.importTextFile==="function") window.NativeLibrary.importTextFile(); else setStatus("Open this app on Android to import a text file."); }
  window.receiveImportedOutline = function(raw){
    try{
      const parsed=parseOutline(raw);
      const existing=packages.find(p=>p.title.toLocaleLowerCase()===parsed.title.toLocaleLowerCase());
      const pkg={id:id(),title:parsed.title,nodes:parsed.nodes,importedAt:new Date().toISOString()};
      if(existing){
        if(!confirm('A package named "'+parsed.title+'" already exists. Replace it with the imported outline?')) {setStatus("Import cancelled.");return;}
        packages=packages.map(p=>p.id===existing.id?{...pkg,id:existing.id}:p);
      }else packages.unshift(pkg);
      save();currentPackageId=pkg.id;currentNodeId=null;expanded=new Set();
      $("search").value="";render();setStatus('Imported "'+parsed.title+'". '+countNodes(pkg)+' concepts saved on this device.');
    }catch(e){alert("Could not import outline:\n"+e.message+"\n\nCheck that the first line is the title and each nested level uses exactly four spaces.");}
  };
  function renderHome(){
    $("homeView").classList.remove("hidden");$("detailView").classList.add("hidden");$("searchResults").innerHTML="";
    const host=$("packages");
    if(!packages.length){host.innerHTML=`<div class="card empty"><div style="font-size:28px;margin-bottom:8px">▤</div><strong>Your library is empty</strong><p>Import any outline saved as a plain-text .txt file to get started.</p><button onclick="document.getElementById('importBtn').click()">Import first outline</button></div>`;return;}
    host.innerHTML=packages.map(p=>`<div class="card pkg"><div class="pkgmain"><div class="pkgtitle">${escapeHtml(p.title)}</div><div class="meta">${countNodes(p)} concepts · Imported ${new Date(p.importedAt).toLocaleDateString()}</div></div><button onclick="openPackage('${p.id}')">Open</button><button class="danger small" onclick="deletePackage('${p.id}')">Delete</button></div>`).join("");
  }
  window.openPackage=function(pid){currentPackageId=pid;currentNodeId=null;expanded=new Set();renderDetail();};
  window.deletePackage=function(pid){const p=packages.find(x=>x.id===pid);if(p&&confirm('Delete "'+p.title+'" from this device? This cannot be undone.')){packages=packages.filter(x=>x.id!==pid);save();if(currentPackageId===pid)currentPackageId=null;render();setStatus("Package deleted.");}};
  function getPackage(){return packages.find(p=>p.id===currentPackageId);}
  function findNode(nodes,nid,parent=null,path=[]){for(const n of nodes){const next=[...path,n];if(n.id===nid)return {node:n,parent,path:next};const f=findNode(n.children||[],nid,n,next);if(f)return f;}return null;}
  function renderDetail(){
    const p=getPackage();if(!p){renderHome();return;}
    $("homeView").classList.add("hidden");$("searchResults").innerHTML="";$("detailView").classList.remove("hidden");
    const found=currentNodeId?findNode(p.nodes,currentNodeId):null;
    const shown=found?found.node.children:p.nodes;
    const path=found?found.path.map(n=>n.title):[p.title];
    $("detailView").innerHTML=`<div class="crumb"><a href="#" onclick="openPackage('${p.id}');return false">⌂ ${escapeHtml(p.title)}</a>${found?' / '+path.slice(1).map(escapeHtml).join(' / '):''}</div>
    <div class="card"><div class="pkgtitle">${escapeHtml(found?found.node.title:p.title)}</div><div class="meta">${found?countNodes({nodes:[found.node]})+' concepts below':' '+countNodes(p)+' concepts in this package'}</div>
    <div class="toolbar"><button class="secondary" onclick="goParent()">↑ Parent</button><button class="secondary" onclick="expandAll()">Expand all</button><button class="secondary" onclick="collapseAll()">Collapse all</button><button onclick="addItem()">＋ Add item</button><button class="secondary" onclick="editOutline()">✎ Edit outline</button></div></div>
    <div id="outlineEditorPanel" class="card editor-panel hidden"><div class="pkgtitle">Edit outline text</div><p class="editor-help">Edit the title and text below. Use four spaces for each nested level. Saving updates this package on your device.</p><textarea id="outlineEditor" class="outline-editor" spellcheck="false" aria-label="Edit outline text"></textarea><div class="toolbar"><button onclick="saveOutlineEdit()">Save changes</button><button class="secondary" onclick="cancelOutlineEdit()">Cancel</button></div></div>
    <div class="section-title">${found?'Subcategories and concepts':'Main categories'}</div><div id="treeHost"></div>`;
    renderTree(shown,"treeHost",0);
  }
  function outlineToText(p){
    const lines=[p.title];
    function walk(nodes,level){
      for(const n of nodes||[]){
        lines.push("    ".repeat(level)+n.title);
        walk(n.children||[],level+1);
      }
    }
    walk(p.nodes,0);
    return lines.join("\n");
  }
  window.editOutline=function(){
    const p=getPackage();if(!p)return;
    $("outlineEditor").value=outlineToText(p);
    $("outlineEditorPanel").classList.remove("hidden");
    $("treeHost").classList.add("hidden");
    $("outlineEditor").focus();
  };
  window.cancelOutlineEdit=function(){
    $("outlineEditorPanel").classList.add("hidden");
    $("treeHost").classList.remove("hidden");
  };
  window.saveOutlineEdit=function(){
    const p=getPackage();if(!p)return;
    try{
      const parsed=parseOutline($("outlineEditor").value);
      const updated={...p,title:parsed.title,nodes:parsed.nodes,editedAt:new Date().toISOString()};
      packages=packages.map(item=>item.id===p.id?updated:item);
      save();
      currentPackageId=updated.id;currentNodeId=null;expanded=new Set();
      renderDetail();
      setStatus('Saved changes to "'+updated.title+'". Your edits are stored on this device.');
    }catch(e){
      alert("Could not save outline:\n"+e.message+"\n\nUse four spaces per nested level, and make sure the first line is the package title.");
    }
  };
  function renderTree(nodes,hostId,depth){
    const host=$(hostId);if(!host)return;
    if(!nodes.length){host.innerHTML='<div class="empty">No subcategories at this level.</div>';return;}
    host.innerHTML=nodes.map(n=>{
      const has=n.children&&n.children.length, isOpen=expanded.has(n.id);
      return `<div class="treeitem"><button class="treebtn" type="button"><span class="nodetitle">${escapeHtml(n.title)}</span><span class="meta">${has?n.children.length+' children':''}</span></button>
      <div class="nodeactions"><button class="secondary small" onclick="openNode('${n.id}')">Open</button><button class="secondary small" onclick="editNode('${n.id}')">Edit</button><button class="secondary small" onclick="addChild('${n.id}')">＋ Add child</button><button class="danger small" onclick="deleteNode('${n.id}')">Delete</button>${has?`<button class="secondary small" onclick="toggleNode('${n.id}')">${isOpen?'Collapse':'Expand'}</button>`:''}</div>
      ${has&&isOpen?`<div style="padding-left:8px" id="children-${n.id}"></div>`:''}</div>`;
    }).join("");
    for(const n of nodes) if(n.children&&n.children.length&&expanded.has(n.id)){const el=$("children-"+n.id);if(el)renderTree(n.children,el.id,depth+1);}
  }
  window.selectNode=function(nid){openNode(nid);};
  window.deleteNode=function(nid){
    const p=getPackage();if(!p)return;
    const f=findNode(p.nodes,nid);if(!f)return;
    if(!confirm('Delete "'+f.node.title+'" and all its descendants? This cannot be undone.'))return;
    if(f.parent)f.parent.children=f.parent.children.filter(n=>n.id!==nid);
    else p.nodes=p.nodes.filter(n=>n.id!==nid);
    for(const n of allNodes([f.node]))expanded.delete(n.id);
    p.editedAt=new Date().toISOString();
    save();renderDetail();
    setStatus("Concept and its descendants deleted.");
  };
  window.editNode=function(nid){
    const p=getPackage();if(!p)return;
    const f=findNode(p.nodes,nid);if(!f)return;
    const title=prompt("Edit concept title:",f.node.title);
    if(title===null)return;
    const clean=title.trim();
    if(!clean){alert("A concept title cannot be empty.");return;}
    f.node.title=clean;
    p.editedAt=new Date().toISOString();
    save();renderDetail();
    setStatus("Concept updated.");
  };
  window.addChild=function(parentId){
    const p=getPackage();if(!p)return;
    const title=prompt(parentId?"New child concept title:":"New top-level concept title:");
    if(title===null)return;
    const clean=title.trim();
    if(!clean){alert("A concept title cannot be empty.");return;}
    const node={id:id(),title:clean,children:[]};
    if(parentId){
      const f=findNode(p.nodes,parentId);if(!f)return;
      if(!Array.isArray(f.node.children))f.node.children=[];
      f.node.children.push(node);
      expanded.add(parentId);
    }else{
      p.nodes.push(node);
    }
    p.editedAt=new Date().toISOString();
    save();renderDetail();
    setStatus("New concept added and saved on this device.");
  };
  window.addItem=function(){addChild(currentNodeId);};
  window.toggleNode=function(nid){if(expanded.has(nid))expanded.delete(nid);else expanded.add(nid);renderDetail();};
  window.openNode=function(nid){currentNodeId=nid;renderDetail();};
  window.goParent=function(){if(!currentNodeId){renderHome();return;}const p=getPackage(),f=findNode(p.nodes,currentNodeId);if(f&&f.path.length>1)currentNodeId=f.path[f.path.length-2].id;else currentNodeId=null;renderDetail();};
  window.expandAll=function(){const p=getPackage();if(p)for(const n of allNodes(p.nodes))if(n.children.length)expanded.add(n.id);renderDetail();};
  window.collapseAll=function(){expanded.clear();renderDetail();};
  function search(q){
    const out=$("searchResults");const query=q.trim().toLocaleLowerCase();
    if(!query){out.innerHTML="";$("homeView").classList.remove("hidden");$("detailView").classList.add("hidden");return;}
    $("homeView").classList.add("hidden");$("detailView").classList.add("hidden");
    const hits=[];
    for(const p of packages){
      if(p.title.toLocaleLowerCase().includes(query))hits.push({type:"Package",title:p.title,pkg:p,path:p.title,packageHit:true});
      for(const n of allNodes(p.nodes)){
        if(n.title.toLocaleLowerCase().includes(query)){
          const f=findNode(p.nodes,n.id);
          hits.push({type:"Concept",title:n.title,pkg:p,path:p.title+" / "+f.path.map(x=>x.title).join(" / "),node:n});
        }
      }
    }
    out.innerHTML=`<div class="section-title">Search results · ${hits.length}</div>`+(hits.length?hits.slice(0,250).map(h=>`<div class="card result" onclick="${h.packageHit?`openPackage('${h.pkg.id}')`:`openSearchHit('${h.pkg.id}','${h.node.id}')`}"><div class="meta">${h.type}</div><strong>${escapeHtml(h.title)}</strong><div class="meta">${escapeHtml(h.path)}</div></div>`).join(""):'<div class="empty">No matching package or concept found.</div>');
  }
  window.openSearchHit=function(pid,nid){openPackage(pid);currentNodeId=nid;renderDetail();};
  function render(){const q=$("search").value;if(q.trim())search(q);else renderHome();}
  $("importBtn").addEventListener("click",importFile);
  $("homeBtn").addEventListener("click",()=>{$("search").value="";currentPackageId=null;currentNodeId=null;renderHome();});
  $("search").addEventListener("input",e=>search(e.target.value));
  window.canGoBackInLibrary=()=>!!currentPackageId||!!$("search").value;
  window.handleAndroidBack=()=>{if($("search").value){$("search").value="";search("");return true;}if(currentNodeId){goParent();return true;}if(currentPackageId){currentPackageId=null;renderHome();return true;}return false;};
  renderHome();
})();
</script>
</body>
</html>
